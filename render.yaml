services:
  - type: web
    name: github-pr-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:10000 src.main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: WEBHOOK_PORT
        value: 10000

