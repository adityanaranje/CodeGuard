<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeGuard Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #050b14;
            --card-bg: rgba(20, 30, 48, 0.7);
            --accent-cyan: #00f2ff;
            --accent-magenta: #ff69b4;
            /* Hot Pink */
            --accent-yellow: #f9d423;
            --text-main: #e0e6ed;
            --text-muted: #94a3b8;
            --neon-glow: 0 0 15px rgba(0, 242, 255, 0.4);
        }

        body {
            background: radial-gradient(circle at top right, #0a192f, #050b14);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Glassmorphism Sidebar-ish Layout */
        .dashboard-container {
            min-height: 100vh;
        }


        .main-content {
            padding: 2.5rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.6);
            letter-spacing: -1px;
        }

        .logo span {
            color: var(--accent-cyan);
        }

        /* Premium Cards */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 100%;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border-color: rgba(0, 242, 255, 0.3);
        }

        .metric-title {
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            margin-bottom: 1rem;
        }

        .metric-value {
            font-size: 5rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        /* Distribution Charts */
        .chart-container {
            position: relative;
            height: 300px;
        }

        /* Recent Reviews List Style */
        .review-item {
            display: flex;
            align-items: center;
            padding: 1.25rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            margin-bottom: 1rem;
            border-left: 4px solid transparent;
            transition: 0.3s;
        }

        .review-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(10px);
        }

        .review-item.pass {
            border-left-color: var(--accent-cyan);
        }

        .review-item.fail {
            border-left-color: var(--accent-magenta);
        }

        .review-item.needs {
            border-left-color: var(--accent-yellow);
        }

        .review-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1.5rem;
            font-weight: bold;
        }

        .review-info h6 {
            margin: 0;
            font-weight: 600;
            color: #fff;
        }

        .review-info p {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .time-badge {
            margin-left: auto;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }

        .filter-section {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .custom-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            padding: 0.75rem 1.5rem;
            outline: none;
            transition: 0.3s;
            flex: 1;
        }

        .custom-select:focus {
            border-color: var(--accent-cyan);
            box-shadow: var(--neon-glow);
            background-color: #0a192f;
        }

        .custom-select option {
            background-color: #0a192f;
            color: #fff;
            padding: 10px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2.5rem;
            margin-top: 2rem;
            flex-grow: 1;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            line-height: 1;
        }

        .stat-value.pass {
            color: var(--accent-cyan);
        }

        .stat-value.fail {
            color: var(--accent-magenta);
        }

        .stat-value.needs {
            color: var(--accent-yellow);
        }

        .btn-apply {
            background: linear-gradient(135deg, #00f2ff, #00d2ff);
            border: none;
            border-radius: 12px;
            color: #050b14;
            padding: 0.75rem 2rem;
            font-weight: 700;
            transition: 0.3s;
        }

        .btn-apply:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.5);
        }
    </style>
</head>

<body>
    <div class="dashboard-container">

        <main class="main-content">
            <header class="header">
                <div class="logo">Code<span>Guard</span></div>
                <div class="filter-section">
                    <select class="custom-select" id="repoFilter">
                        <option value="">All Repositories</option>
                    </select>
                    <select class="custom-select" id="authorFilter">
                        <option value="">All Authors</option>
                    </select>
                    <button class="btn-apply" onclick="fetchData()">APPLY FILTERS</button>
                </div>
            </header>

            <div class="row g-4 mb-4">
                <div class="col-md-5">
                    <div class="glass-card d-flex flex-column">
                        <div class="metric-title">Snapshot</div>
                        <div class="stats-grid">
                            <div class="stat-item">
                                <div class="stat-label">Total</div>
                                <div class="stat-value" id="totalReviews">0</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Passed</div>
                                <div class="stat-value pass" id="passCount">0</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Failed</div>
                                <div class="stat-value fail" id="failCount">0</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Needs Review</div>
                                <div class="stat-value needs" id="needsReviewCount">0</div>
                            </div>
                        </div>
                        <div
                            style="color: var(--accent-cyan); font-weight: 600; font-size: 0.8rem; margin-top: 1.5rem;">
                            ↑ 12% activity from last week
                        </div>
                    </div>
                </div>
                <div class="col-md-7">
                    <div class="glass-card">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="metric-title">Verdict Distribution</div>
                            <div id="chartLegend" style="display: flex; gap: 1rem; font-size: 0.75rem;"></div>
                        </div>
                        <div class="chart-container">
                            <canvas id="verdictChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4 mb-4">
                <div class="col-md-8">
                    <div class="glass-card">
                        <div class="metric-title">Code Health Trends</div>
                        <div style="height: 300px;">
                            <canvas id="trendsChart"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass-card">
                        <div class="metric-title">Recent Activity</div>
                        <div id="activityList" style="max-height: 300px; overflow-y: auto; padding-right: 0.5rem;">
                            <!-- List of review items -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-12">
                    <div class="glass-card">
                        <div class="metric-title">Developer Velocity</div>
                        <div style="height: 200px;">
                            <canvas id="authorChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Use Outfit font for charts
        Chart.defaults.font.family = "'Outfit', sans-serif";
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.05)';

        let verdictChartInstance = null;
        let authorChartInstance = null;
        let trendsChartInstance = null;

        async function init() {
            try {
                const response = await fetch('/api/filters');
                const data = await response.json();

                const repoSelect = document.getElementById('repoFilter');
                data.repos.forEach(repo => {
                    const option = document.createElement('option');
                    option.value = repo;
                    option.textContent = repo;
                    repoSelect.appendChild(option);
                });

                const authorSelect = document.getElementById('authorFilter');
                data.authors.forEach(author => {
                    const option = document.createElement('option');
                    option.value = author;
                    option.textContent = author;
                    authorSelect.appendChild(option);
                });

                fetchData();
            } catch (error) {
                console.error('Error loading filters:', error);
            }
        }

        async function fetchData() {
            const repo = document.getElementById('repoFilter').value;
            const author = document.getElementById('authorFilter').value;

            const params = new URLSearchParams();
            if (repo) params.append('repo', repo);
            if (author) params.append('author', author);

            try {
                const response = await fetch(`/api/stats?${params.toString()}`);
                const data = await response.json();

                document.getElementById('totalReviews').textContent = data.stats.total_reviews || 0;
                document.getElementById('passCount').textContent = data.stats.verdict_counts.PASS || 0;
                document.getElementById('failCount').textContent = data.stats.verdict_counts.FAIL || 0;
                document.getElementById('needsReviewCount').textContent = data.stats.verdict_counts.NEEDS_REVIEW || 0;

                updateVerdictChart(data.stats.verdict_counts);
                updateAuthorChart(data.stats.author_stats);
                updateTrendsChart(data.trend_data);
                updateActivityList(data.reviews);

            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function updateVerdictChart(counts) {
            const ctx = document.getElementById('verdictChart').getContext('2d');
            if (verdictChartInstance) verdictChartInstance.destroy();

            const labels = Object.keys(counts);
            const data = Object.values(counts);

            const colorMap = {
                'PASS': '#00f2ff',
                'FAIL': '#ff69b4',
                'NEEDS_REVIEW': '#f9d423'
            };
            const backgroundColors = labels.map(label => colorMap[label] || '#94a3b8');

            verdictChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: backgroundColors,
                        hoverOffset: 20,
                        borderWidth: 0,
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '75%',
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        function updateAuthorChart(stats) {
            const ctx = document.getElementById('authorChart').getContext('2d');
            if (authorChartInstance) authorChartInstance.destroy();

            // Safety limit to top 10 if not already handled by backend
            const sortedEntries = Object.entries(stats)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);

            const labels = sortedEntries.map(e => e[0]);
            const data = sortedEntries.map(e => e[1]);

            authorChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'PRs Reviewed',
                        data: data,
                        backgroundColor: 'rgba(0, 242, 255, 0.2)',
                        borderColor: '#00f2ff',
                        borderWidth: 2,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, grid: { display: false } },
                        x: { grid: { display: false } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function updateTrendsChart(trendData) {
            const ctx = document.getElementById('trendsChart').getContext('2d');
            if (trendsChartInstance) trendsChartInstance.destroy();

            trendsChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: trendData.map(d => d.date),
                    datasets: [{
                        label: 'PR Activity',
                        data: trendData.map(d => d.total),
                        borderColor: '#00f2ff',
                        backgroundColor: 'rgba(0, 242, 255, 0.05)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 3,
                        pointBackgroundColor: '#00f2ff',
                        pointBorderColor: '#050b14',
                        pointBorderWidth: 2,
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true },
                        x: { grid: { display: false } }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        function updateActivityList(reviews) {
            const container = document.getElementById('activityList');
            container.innerHTML = '';

            reviews.forEach(review => {
                const div = document.createElement('div');
                let statusClass = 'needs';
                let icon = '⚡';

                if (review.verdict === 'PASS') {
                    statusClass = 'pass';
                    icon = '✓';
                } else if (review.verdict === 'FAIL') {
                    statusClass = 'fail';
                    icon = '×';
                }

                div.className = `review-item ${statusClass}`;

                // Format relative time (mocking for beauty)
                const date = new Date(review.timestamp);
                const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                div.innerHTML = `
                    <div class="review-icon" style="background: rgba(255,255,255,0.05); color: #fff;">${icon}</div>
                    <div class="review-info">
                        <h6>PR #${review.pr_number} - ${review.repo_name.split('/')[1]}</h6>
                        <p>@${review.author} • ${review.files_changed} files changed</p>
                    </div>
                    <div class="time-badge">${timeStr}</div>
                `;
                container.appendChild(div);
            });
        }

        init();
    </script>
</body>

</html>
