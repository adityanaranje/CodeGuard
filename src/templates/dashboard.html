<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR Review Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Modern Dark Mode Tweaks */
        body {
            background-color: #212529;
            /* Dark background matches Bootstrap dark theme */
        }

        .card {
            background-color: #2b3035;
            /* Slightly lighter than body */
            border: 1px solid #495057;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            /* Darker shadow */
            margin-bottom: 20px;
        }

        h5 {
            color: #e9ecef;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
        }

        .verdict-pass {
            color: #2ea043;
            /* GitHub Success Green */
            font-weight: bold;
        }

        .verdict-fail {
            color: #da3633;
            /* GitHub Failure Red */
            font-weight: bold;
        }

        .verdict-needing {
            color: #d29922;
            /* GitHub Warning Yellow */
            font-weight: bold;
        }

        .navbar-brand {
            font-weight: bold;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark mb-4 border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand" href="#">🤖 PR Review Bot Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <!-- Filters -->
        <div class="card p-3 mb-4">
            <div class="row g-3">
                <div class="col-md-5">
                    <label for="repoFilter" class="form-label text-light">Repository</label>
                    <select class="form-select bg-dark text-light border-secondary" id="repoFilter">
                        <option value="">All Repositories</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label for="authorFilter" class="form-label text-light">Author</label>
                    <select class="form-select bg-dark text-light border-secondary" id="authorFilter">
                        <option value="">All Authors</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button class="btn btn-primary w-100" onclick="fetchData()">Apply Filters</button>
                </div>
            </div>
        </div>

        <!-- Metrics -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card text-center p-3">
                    <h5 class="text-muted">Total Reviews</h5>
                    <div class="metric-value" id="totalReviews">-</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center p-3">
                    <h5 class="text-muted">Avg Severity</h5>
                    <div class="metric-value" id="avgSeverity">-</div>
                </div>
            </div>
        </div>

        <!-- Trend Chart -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card p-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5>PR Trends (Last 30 days)</h5>
                        <!-- Toggle for Chart Mode -->
                        <div class="btn-group" role="group" aria-label="Chart mode">
                            <input type="radio" class="btn-check" name="chartMode" id="modeTotal" value="total" checked
                                onchange="updateTrendChartConfig()">
                            <label class="btn btn-outline-primary" for="modeTotal">Total PRs</label>

                            <input type="radio" class="btn-check" name="chartMode" id="modeSplit" value="split"
                                onchange="updateTrendChartConfig()">
                            <label class="btn btn-outline-primary" for="modeSplit">Split by Verdict</label>
                        </div>
                    </div>
                    <canvas id="trendsChart" height="80"></canvas>
                </div>
            </div>
        </div>

        <!-- Distribution Charts -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card p-3">
                    <h5>Verdict Distribution</h5>
                    <canvas id="verdictChart"></canvas>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-3">
                    <h5>Top Active Authors</h5>
                    <canvas id="authorChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="card p-3">
            <h5>Recent Activity</h5>
            <div class="table-responsive">
                <table class="table table-hover table-dark" id="reviewsTable">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Repo</th>
                            <th>PR</th>
                            <th>Author</th>
                            <th>Files</th>
                            <th>Changes</th>
                            <th>Verdict</th>
                            <th>Sev</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows will be populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Chart Defaults for Dark Mode
        Chart.defaults.color = '#adb5bd';
        Chart.defaults.borderColor = '#495057';

        let verdictChartInstance = null;
        let authorChartInstance = null;
        let trendsChartInstance = null;
        let cachedTrendData = [];

        async function init() {
            // Load filters
            try {
                const response = await fetch('/api/filters');
                const data = await response.json();

                const repoSelect = document.getElementById('repoFilter');
                data.repos.forEach(repo => {
                    const option = document.createElement('option');
                    option.value = repo;
                    option.textContent = repo;
                    repoSelect.appendChild(option);
                });

                const authorSelect = document.getElementById('authorFilter');
                data.authors.forEach(author => {
                    const option = document.createElement('option');
                    option.value = author;
                    option.textContent = author;
                    authorSelect.appendChild(option);
                });

                fetchData();
            } catch (error) {
                console.error('Error loading filters:', error);
            }
        }

        async function fetchData() {
            const repo = document.getElementById('repoFilter').value;
            const author = document.getElementById('authorFilter').value;

            const params = new URLSearchParams();
            if (repo) params.append('repo', repo);
            if (author) params.append('author', author);

            try {
                const response = await fetch(`/api/stats?${params.toString()}`);
                const data = await response.json();

                updateMetrics(data);
                updateCharts(data.stats);
                updateTable(data.reviews);

                cachedTrendData = data.trend_data;
                updateTrendChartConfig(); // Initial render

            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function updateMetrics(data) {
            document.getElementById('totalReviews').textContent = data.stats.total_reviews;

            let totalSeverity = 0;
            data.reviews.forEach(r => totalSeverity += r.llm_severity);

            if (data.reviews.length > 0) {
                document.getElementById('avgSeverity').textContent = (totalSeverity / data.reviews.length).toFixed(1);
            } else {
                document.getElementById('avgSeverity').textContent = "0";
            }
        }

        function updateTrendChartConfig() {
            const ctx = document.getElementById('trendsChart').getContext('2d');
            const mode = document.querySelector('input[name="chartMode"]:checked').value;

            if (trendsChartInstance) trendsChartInstance.destroy();

            const labels = cachedTrendData.map(d => d.date);
            let datasets = [];

            if (mode === 'total') {
                datasets = [{
                    label: 'Total PRs',
                    data: cachedTrendData.map(d => d.total),
                    borderColor: '#0d6efd', // Bootstrap Primary Blue
                    backgroundColor: 'rgba(13, 110, 253, 0.1)',
                    fill: true,
                    tension: 0.3
                }];
            } else {
                datasets = [
                    {
                        label: 'Pass',
                        data: cachedTrendData.map(d => d.pass_count),
                        borderColor: '#2ea043',
                        backgroundColor: 'transparent',
                        tension: 0.3
                    },
                    {
                        label: 'Fail',
                        data: cachedTrendData.map(d => d.fail_count),
                        borderColor: '#da3633',
                        backgroundColor: 'transparent',
                        tension: 0.3
                    },
                    {
                        label: 'Needs Review',
                        data: cachedTrendData.map(d => d.needs_review_count),
                        borderColor: '#d29922',
                        backgroundColor: 'transparent',
                        tension: 0.3
                    }
                ];
            }

            trendsChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { precision: 0 }
                        }
                    }
                }
            });
        }

        function updateCharts(stats) {
            // Verdict Chart
            const verdictCtx = document.getElementById('verdictChart').getContext('2d');
            if (verdictChartInstance) verdictChartInstance.destroy();

            const labels = Object.keys(stats.verdict_counts);
            const data = Object.values(stats.verdict_counts);
            const colors = labels.map(label => {
                if (label === 'PASS') return '#2ea043';
                if (label === 'FAIL') return '#da3633';
                if (label === 'NEEDS_REVIEW') return '#d29922';
                return '#17a2b8';
            });

            verdictChartInstance = new Chart(verdictCtx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 0
                    }]
                }
            });

            // Author Chart
            const authorCtx = document.getElementById('authorChart').getContext('2d');
            if (authorChartInstance) authorChartInstance.destroy();

            authorChartInstance = new Chart(authorCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(stats.author_stats),
                    datasets: [{
                        label: 'Reviews Count',
                        data: Object.values(stats.author_stats),
                        backgroundColor: '#0d6efd'
                    }]
                },
                options: {
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1 } }
                    }
                }
            });
        }

        function updateTable(reviews) {
            const tbody = document.querySelector('#reviewsTable tbody');
            tbody.innerHTML = '';

            reviews.forEach(review => {
                const tr = document.createElement('tr');

                // Handle Timezone (Force IST)
                let timestamp = review.timestamp;
                if (!timestamp.endsWith('Z') && !timestamp.includes('+')) {
                    timestamp += 'Z'; // Assume naive times are UTC from Render
                }
                const dateObj = new Date(timestamp);
                const date = dateObj.toLocaleString('en-IN', {
                    timeZone: 'Asia/Kolkata',
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit', second: '2-digit',
                    hour12: false
                });

                let verdictClass = '';
                if (review.verdict === 'PASS') verdictClass = 'verdict-pass';
                else if (review.verdict === 'FAIL') verdictClass = 'verdict-fail';
                else verdictClass = 'verdict-needing';

                tr.innerHTML = `
                    <td><small>${date}</small></td>
                    <td>${review.repo_name.split('/')[1] || review.repo_name}</td>
                    <td>#${review.pr_number}</td>
                    <td>${review.author}</td>
                    <td>${review.files_changed}</td>
                    <td>${review.total_changes}</td>
                    <td class="${verdictClass}">${review.verdict}</td>
                    <td>${review.llm_severity}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        init();
    </script>
</body>

</html>
